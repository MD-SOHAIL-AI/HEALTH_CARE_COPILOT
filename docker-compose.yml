services:
  mysql:
    image: mysql:8.0
    container_name: medcare-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: medcare
      MYSQL_USER: medcare
      MYSQL_PASSWORD: medcare
    ports:
      - "3306:3306"
    volumes:
      - medcare_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-umedcare", "-pmedcare"]
      interval: 10s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:4
    container_name: medcare-adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    depends_on:
      - mysql

volumes:
  medcare_mysql_data:
